<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting | Vansh Thakur Portfolio</title>
    <!-- Meta refresh fallback redirect -->
    <meta http-equiv="refresh" content="0; url=html/index.html">

    <!-- Preconnect resources for optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0B0B0C;
            color: #F4F2EE;
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Ambient light gradient match to project aesthetics */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 140, 255, 0.15) 0%, rgba(85, 214, 190, 0.05) 60%, transparent 100%);
            filter: blur(50px);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #ffffff;
        }

        .accent {
            color: #55D6BE;
        }

        .subtitle {
            font-size: 0.875rem;
            color: #A1A1AA;
        }

        .link-fallback {
            color: #7C8CFF;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dashed rgba(124, 140, 255, 0.4);
            transition: all 0.2s ease;
        }

        .link-fallback:hover {
            color: #55D6BE;
            border-bottom-color: rgba(85, 214, 190, 0.6);
        }

        /* Micro-animation loader */
        .loader {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: inline-block;
            vertical-align: middle;
        }

        .loader-inner {
            box-sizing: border-box;
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top-color: #7C8CFF;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .loader-inner-2 {
            box-sizing: border-box;
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-bottom-color: #55D6BE;
            border-radius: 50%;
            animation: spin-reverse 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes spin-reverse {
            0% {
                transform: rotate(360deg);
            }

            100% {
                transform: rotate(0deg);
            }
        }
    </style>
    <!-- JavaScript immediate redirection -->
    <script>
        window.location.replace("html/index.html");
    </script>
</head>

<body>
    <div class="ambient-glow"></div>
    <div class="container">
        <div class="loader">
            <span class="loader-inner"></span>
            <span class="loader-inner-2"></span>
        </div>
        <div>
            <h1 class="title">Vansh Thakur<span class="accent">.</span></h1>
            <p class="subtitle">Redirecting to portfolio... If it doesn't load, <a class="link-fallback"
                    href="html/index.html">click here</a>.</p>
        </div>
    </div>
</body>

</html>
